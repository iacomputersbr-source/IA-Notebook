<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Computers - Painel de Controle — Notebook</title>
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--naranja:#ff6600;--negro:#0d0d0d;--card:#1a1a1a;--borde:#2b2b2b;--blanco:#ffffff;--texto:#f2f2f2;--muted:#a8a8a8;--verde:#1E9E4A;--azul:#2196F3;--rojo:#e53935}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:var(--negro);color:var(--texto);padding-bottom:76px;-webkit-tap-highlight-color:transparent}
header{background:#000;color:var(--blanco);padding:14px;text-align:center;border-bottom:4px solid var(--naranja);position:sticky;top:0;z-index:50}
header h1{font-size:18px;font-weight:800}header h1 span{color:var(--naranja)}
.container{max-width:640px;margin:0 auto;padding:12px}
.tab{display:none}.tab.on{display:block}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:2px solid var(--borde);display:flex;z-index:60}
.bottomnav button{flex:1;background:none;border:none;padding:12px 4px;font-size:12px;font-weight:700;color:#777;cursor:pointer}
.bottomnav button.on{color:var(--naranja)}
.bottomnav button b{display:block;font-size:20px}
.cards{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cards.c{flex:1;min-width:100px;background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:12px;text-align:center}
.cards.c b{font-size:19px;display:block;color:var(--blanco)}.cards.c small{color:var(--muted);font-size:11px}
.c.ing b{color:var(--verde)}.c.gas b{color:var(--rojo)}.c.bal b{color:var(--naranja)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{flex:1;padding:9px;border:2px solid var(--borde);background:var(--card);color:var(--texto);border-radius:9px;font-weight:700;cursor:pointer;font-size:12px;min-width:58px}
.filters button.on{border-color:var(--naranja);background:#2a1a08;color:var(--blanco)}
.ticket{background:var(--card);border:1px solid var(--borde);border-left:5px solid #555;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.ticket.N1{border-left-color:var(--azul)}.ticket.N2{border-left-color:var(--naranja)}
.ticket h3{font-size:14.5px;margin-bottom:6px;color:var(--blanco)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#fff;margin-right:6px}
.bN1{background:var(--azul)}.bN2{background:var(--naranja)}
.st{font-size:11px;padding:3px 10px;border-radius:12px;background:#2b2b2b;color:#ddd;font-weight:600}
.ticket p{font-size:13px;margin:4px 0;color:var(--muted)}.ticket.big{font-size:14px;font-weight:700;color:var(--blanco)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button,.actions a{flex:1;padding:10px;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:12.5px;text-align:center;text-decoration:none;min-width:76px;color:#fff}
.wa{background:var(--verde)}.map{background:#4285F4}.del{background:var(--rojo)}.cob{background:var(--naranja)}
.empty{text-align:center;color:#777;padding:36px;font-size:14px}
select,input,textarea{padding:10px;border-radius:9px;border:1.5px solid var(--borde);background:#242424;color:var(--blanco);font-size:14px;width:100%;margin:5px 0;font-family:inherit}
select option{color:#111}
input::placeholder,textarea::placeholder{color:#777}
input[type=date]{color-scheme:dark}
select{margin-top:8px}
.hoy{background:#2a2108;border:2px solid var(--naranja);border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--blanco)}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.flabel{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 2px}
h2.sec{font-size:16px;font-weight:800;margin:14px 0 8px;border-left:5px solid var(--naranja);padding-left:10px;color:var(--blanco)}
.mov{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.mov.v{font-weight:800;font-size:15px}.mov.v.in{color:var(--verde)}.mov.v.out{color:var(--rojo)}
.mov small{color:var(--muted);font-size:11px;display:block}
.mov b{color:var(--blanco)}
.mov button{background:none;border:none;color:var(--rojo);font-size:16px;cursor:pointer;padding:4px 8px}
.bar-row{margin:8px 0;font-size:13px;color:var(--texto)}
.bar-row.lbl{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.bar{height:14px;background:#2b2b2b;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--naranja)}
.bar i.az{background:var(--azul)}.bar i.vd{background:var(--verde)}
.cardbox{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:16px;margin-bottom:12px}
.btn-add{background:var(--naranja);color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px}
.seg{display:flex;gap:8px;margin:5px 0}.seg label{flex:1;text-align:center;padding:10px;border:2px solid var(--borde);background:#242424;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg input{display:none}.seg label.sel-in{border-color:var(--verde);background:#0f2a18;color:var(--verde)}.seg label.sel-out{border-color:var(--rojo);background:#2a0f0f;color:var(--rojo)}
.kpi{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.kpi b{color:var(--blanco)}
@media(max-width:380px){.filters button{min-width:52px;font-size:11px}}
</style>
</head>
<body>
<header><h1>IA <span>COMPUTERS</span> — Notebook</h1></header>
<div class="container">

<div class="tab on" id="tab-visitas">
<div class="hoy" id="hoy"></div>
<div class="cards">
<div class="c"><b id="c-total">0</b><small>Visitas</small></div>
<div class="c"><b id="c-n1">0</b><small>N1</small></div>
<div class="c"><b id="c-n2">0</b><small>N2</small></div>
<div class="c"><b id="c-hoy">0</b><small>Hoje</small></div>
</div>
<div class="filters">
<button class="on" onclick="filtrar('todas',this)">Todas</button>
<button onclick="filtrar('N1',this)">N1</button>
<button onclick="filtrar('N2',this)">N2</button>
<button onclick="filtrar('Agendada',this)">Agend.</button>
<button onclick="filtrar('hoje',this)">Hoje</button>
</div>
<div id="lista"></div>
</div>

<div class="tab" id="tab-finanzas">
<h2 class="sec">Resumo do mês</h2>
<div class="cards">
<div class="c ing"><b id="f-ing">R$ 0</b><small>Receitas</small></div>
<div class="c gas"><b id="f-gas">R$ 0</b><small>Despesas</small></div>
<div class="c bal"><b id="f-bal">R$ 0</b><small>Saldo</small></div>
</div>
<h2 class="sec">Registrar movimento</h2>
<div class="cardbox">
<div class="seg" id="seg-tipo">
<label class="sel-in"><input type="radio" name="mtipo" value="in" checked>⬆ Receita</label>
<label><input type="radio" name="mtipo" value="out">⬇ Despesa</label>
</div>
<input type="text" id="m-desc" placeholder="Descrição (ex: Visita NB-123456, compra de peça)">
<div class="row2">
<div><label class="flabel">Valor R$</label><input type="number" id="m-valor" min="0" step="0.01"></div>
<div><label class="flabel">Data</label><input type="date" id="m-fecha"></div>
</div>
<button class="btn-add" onclick="addMov()">Salvar</button>
</div>
<h2 class="sec">Movimentos</h2>
<div class="filters">
<button class="on" onclick="ffiltrar('todos',this)">Todos</button>
<button onclick="ffiltrar('in',this)">Receitas</button>
<button onclick="ffiltrar('out',this)">Despesas</button>
</div>
<div id="movs"></div>
</div>

<div class="tab" id="tab-reportes">
<h2 class="sec">Visitas por nível</h2>
<div class="cardbox" id="rep-nivel"></div>
<h2 class="sec">Visitas por estado</h2>
<div class="cardbox" id="rep-estado"></div>
<h2 class="sec">Receitas últimos 6 meses</h2>
<div class="cardbox" id="rep-mes"></div>
<h2 class="sec">Serviços mais pedidos</h2>
<div class="cardbox" id="rep-serv"></div>
<h2 class="sec">Indicadores</h2>
<div class="cardbox"><div class="kpi" id="rep-kpi"></div></div>
</div>

</div>

<nav class="bottomnav">
<button class="on" onclick="goTab('visitas',this)"><b>🏠</b>Visitas</button>
<button onclick="goTab('finanzas',this)"><b>💰</b>Finanças</button>
<button onclick="goTab('reportes',this)"><b>📊</b>Relatórios</button>
</nav>

<script>
function goTab(t,btn){var ts=document.querySelectorAll('.tab');for(var i=0;i<ts.length;i++)ts[i].classList.remove('on');
document.getElementById('tab-'+t).classList.add('on');
var bs=document.querySelectorAll('.bottomnav button');for(var j=0;j<bs.length;j++)bs[j].classList.remove('on');btn.classList.add('on');
if(t==='finanzas')renderFin();if(t==='reportes')renderRep();window.scrollTo(0,0);}
function getV(){var v=[];try{v=JSON.parse(localStorage.getItem('ia_visitas')||'[]');}catch(e){}return v;}
function saveV(v){try{localStorage.setItem('ia_visitas',JSON.stringify(v));}catch(e){}}
function getM(){var v=[];try{v=JSON.parse(localStorage.getItem('ia_money')||'[]');}catch(e){}return v;}
function saveM(v){try{localStorage.setItem('ia_money',JSON.stringify(v));}catch(e){}}
function hoyStr(){return new Date().toISOString().slice(0,10);}
function fmt(n){return 'R$ '+Number(n).toFixed(2).replace('.',',');}
var filtro='todas';
function filtrar(f,btn){filtro=f;var bs=document.querySelectorAll('#tab-visitas.filters button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');btn.classList.add('on');renderV();}
function renderV(){
var all=getV(),hs=hoyStr();
document.getElementById('hoy').textContent='Hoje '+new Date().toLocaleDateString()+' — '+all.filter(function(t){return t.fecha===hs&&t.estado!=='Finalizada'&&t.estado!=='Cancelada';}).length+' visita(s) pendente(s)';
document.getElementById('c-total').textContent=all.length;
document.getElementById('c-n1').textContent=all.filter(function(t){return t.nvl==='N1';}).length;
document.getElementById('c-n2').textContent=all.filter(function(t){return t.nvl==='N2';}).length;
document.getElementById('c-hoy').textContent=all.filter(function(t){return t.fecha===hs;}).length;
var list=all.slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});
if(filtro==='N1'||filtro==='N2')list=list.filter(function(t){return t.nvl===filtro;});
if(filtro==='Agendada')list=list.filter(function(t){return t.estado==='Agendada';});
if(filtro==='hoje')list=list.filter(function(t){return t.fecha===hs;});
var box=document.getElementById('lista');
if(!list.length){box.innerHTML='<div class="empty">Sem visitas.<br>Compartilhe sua página para agendar.</div>';return;}
var h='';
for(var k=0;k<list.length;k++){var t=list[k],idx=all.indexOf(t);
var maps='https://www.google.com/maps/search/'+encodeURIComponent(t.dir||'');
h+='<div class="ticket '+t.nvl+'"><h3>'+t.tk+' <span class="badge '+(t.nvl==='N1'?'bN1':'bN2')+'">'+t.nvl+'</span><span class="st">'+t.estado+'</span></h3>'
+'<p class="big">💻 Notebook'+(t.marca?' ('+t.marca+')':'')+'</p>'
+'<p class="big">'+t.fecha+' — '+t.turno+'</p><p>📌 '+(t.srv||'-')+'</p>'
+'<p class="big">👤 '+t.nom+' — 📱 '+t.tel+'</p><p>📍 '+(t.dir||'-')+(t.ref?' ('+t.ref+')':'')+'</p><p>📝 '+(t.des||'-')+'</p>'
+(t.valor?'<p class="big">💰 '+fmt(t.valor)+(t.cobrado?' ✓ recebido':'')+'</p>':'')
+'<div class="row2"><div><label class="flabel">Estado</label><select onchange="estado('+idx+',this.value)">'
+'<option'+(t.estado==='Agendada'?' selected':'')+'>Agendada</option>'
+'<option'+(t.estado==='Confirmada'?' selected':'')+'>Confirmada</option>'
+'<option'+(t.estado==='En camino'?' selected':'')+'>En camino</option>'
+'<option'+(t.estado==='Finalizada'?' selected':'')+'>Finalizada</option>'
+'<option'+(t.estado==='Cancelada'?' selected':'')+'>Cancelada</option></select></div>'
+'<div><label class="flabel">Valor R$</label><input type="number" value="'+(t.valor||'')+'" id="val-'+idx+'" min="0" step="0.01"></div></div>'
+'<div class="actions">'
+'<a class="wa" href="https://wa.me/55'+String(t.tel||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Olá '+t.nom+', sou da IA Computers. Confirmo sua visita '+t.tk+' em '+t.fecha+' ('+t.turno+').')+'" target="_blank">WhatsApp</a>'
+'<a class="map" href="'+maps+'" target="_blank">Rota</a>'
+(t.estado==='Finalizada'&&t.valor&&!t.cobrado?'<button class="cob" onclick="cobrar('+idx+')">Receber</button>':'')
+'<button class="del" onclick="borrar('+idx+')">✕</button>'
+'</div></div>';}
box.innerHTML=h;}
function estado(i,v){var t=getV();t[i].estado=v;saveV(t);renderV();}
function borrar(i){if(confirm('Apagar esta visita?')){var t=getV();t.splice(i,1);saveV(t);renderV();}}
function cobrar(i){var t=getV(),m=getM();var val=parseFloat(t[i].valor)||0;if(val<=0){alert('Informe o valor recebido primeiro.');return;}
m.unshift({id:Date.now(),tipo:'in',desc:'Recebimento visita '+t[i].tk+' (Notebook '+(t[i].srv||'')+' '+t[i].nvl+')',valor:val,fecha:hoyStr()});
t[i].cobrado=true;saveM(m);saveV(t);renderV();alert('Recebimento registrado em Finanças.');}
document.addEventListener('change',function(e){if(e.target&&e.target.id&&e.target.id.indexOf('val-')===0){var t=getV();var i=parseInt(e.target.id.split('-')[1]);t[i].valor=e.target.value;saveV(t);renderV();}});
var ff='todos',mtipo='in';
var seg=document.querySelectorAll('#seg-tipo label');
for(var si=0;si<seg.length;si++){seg[si].addEventListener('click',function(){for(var j=0;j<seg.length;j++){seg[j].classList.remove('sel-in');seg[j].classList.remove('sel-out');}
var r=this.querySelector('input');mtipo=r.value;this.classList.add(mtipo==='in'?'sel-in':'sel-out');});}
document.getElementById('m-fecha').value=hoyStr();
function addMov(){var d=document.getElementById('m-desc').value.trim(),v=parseFloat(document.getElementById('m-valor').value),f=document.getElementById('m-fecha').value||hoyStr();
if(!d||!(v>0)){alert('Descrição e valor, por favor.');return;}
var m=getM();m.unshift({id:Date.now(),tipo:mtipo,desc:d,valor:v,fecha:f});saveM(m);
document.getElementById('m-desc').value='';document.getElementById('m-valor').value='';renderFin();}
function ffiltrar(f,btn){ff=f;var bs=document.querySelectorAll('#tab-finanzas.filters button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');btn.classList.add('on');renderFin();}
function delMov(id){if(confirm('Apagar este movimento?')){var m=getM().filter(function(x){return x.id!==id;});saveM(m);renderFin();}}
function renderFin(){var m=getM(),mes=hoyStr().slice(0,7);
var ing=m.filter(function(x){return x.tipo==='in'&&x.fecha.slice(0,7)===mes;}).reduce(function(a,x){return a+ +x.valor;},0);
var gas=m.filter(function(x){return x.tipo==='out'&&x.fecha.slice(0,7)===mes;}).reduce(function(a,x){return a+ +x.valor;},0);
document.getElementById('f-ing').textContent=fmt(ing);
document.getElementById('f-gas').textContent=fmt(gas);
document.getElementById('f-bal').textContent=fmt(ing-gas);
var list=m.slice();if(ff!=='todos')list=list.filter(function(x){return x.tipo===ff;});
var box=document.getElementById('movs');
if(!list.length){box.innerHTML='<div class="empty">Sem movimentos.<br>Registre receitas e despesas aqui.</div>';return;}
var h='';for(var i=0;i<list.length;i++){var x=list[i];
h+='<div class="mov"><div><b style="font-size:13.5px">'+x.desc+'</b><small>'+x.fecha+'</small></div><div style="display:flex;align-items:center;gap:4px"><span class="v '+(x.tipo==='in'?'in':'out')+'">'+(x.tipo==='in'?'+':'−')+fmt(x.valor)+'</span><button onclick="delMov('+x.id+')">🗑</button></div></div>';}
box.innerHTML=h;}
function bars(el,items,color){var max=0,i;for(i=0;i<items.length;i++)if(items[i][1]>max)max=items[i][1];if(max===0)max=1;
var h='';for(i=0;i<items.length;i++){var pct=Math.round(items[i][1]/max*100);
h+='<div class="bar-row"><div class="lbl"><span>'+items[i][0]+'</span><b>'+items[i][2]+'</b></div><div class="bar"><i class="'+color+'" style="width:'+pct+'%"></i></div></div>';}
document.getElementById(el).innerHTML=h||'<p style="color:#777;font-size:13px">Sem dados ainda.</p>';}
function renderRep(){var v=getV(),m=getM();
var n1=v.filter(function(t){return t.nvl==='N1';}).length,n2=v.filter(function(t){return t.nvl==='N2';}).length;
bars('rep-nivel',[['Suporte N1',n1,n1+' visitas'],['Suporte N2',n2,n2+' visitas']],'az');
var sts=['Agendada','Confirmada','En camino','Finalizada','Cancelada'],si=[],k;
for(k=0;k<sts.length;k++){var c=v.filter(function(t){return t.estado===sts[k];}).length;si.push([sts[k],c,c]);}
bars('rep-estado',si,'');
var mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'],mi=[];
var now=new Date();
for(k=5;k>=0;k--){var d=new Date(now.getFullYear(),now.getMonth()-k,1);var key=d.toISOString().slice(0,7);
var ing=m.filter(function(x){return x.tipo==='in'&&x.fecha.slice(0,7)===key;}).reduce(function(a,x){return a+ +x.valor;},0);
mi.push([mn[d.getMonth()]+' '+d.getFullYear(),ing,fmt(ing)]);}
bars('rep-mes',mi,'vd');
var sc={};for(k=0;k<v.length;k++){var s=v[k].srv||'Outro';sc[s]=(sc[s]||0)+1;}
var sa=[];for(var key2 in sc)sa.push([key2,sc[key2],sc[key2]]);
sa.sort(function(a,b){return b[1]-a[1];});
bars('rep-serv',sa.slice(0,6),'');
var fin=v.filter(function(t){return t.estado==='Finalizada';}).length;
var totIng=m.filter(function(x){return x.tipo==='in';}).reduce(function(a,x){return a+ +x.valor;},0);
var nIng=m.filter(function(x){return x.tipo==='in';}).length;
var prom=nIng>0?totIng/nIng:0;
var conv=v.length>0?Math.round(fin/v.length*100):0;
document.getElementById('rep-kpi').innerHTML='• <b>Taxa de finalização:</b> '+conv+'% ('+fin+' de '+v.length+')<br>• <b>Ticket médio:</b> '+fmt(prom)+'<br>• <b>Receitas totais:</b> '+fmt(totIng)+'<br>• <b>Nível mais pedido:</b> '+(n1>=n2?'N1 ('+n1+')':'N2 ('+n2+')');}
renderV();
</script>
</body>
</html>
